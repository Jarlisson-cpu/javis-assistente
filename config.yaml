# ============================================================
# JARVIS - Configuração Central
# ============================================================
# Chaves de API e segredos NÃO ficam aqui — veja .env.example
# ============================================================

app:
  name: "JARVIS"
  version: "0.1.0"
  environment: "development"  # development | production

logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  directory: "logs"
  max_file_size_mb: 10
  backup_count: 5
  console_output: true

security:
  require_confirmation_for:
    - delete_files
    - file.delete
    - automation.delete_file
    - format_disk
    - shutdown
    - purchases
    - send_message
    - send_email
  confirmation_timeout_seconds: 30
  default_deny_on_timeout: true
  permissions: {}

voice:
  stt_engine: "vosk"
  tts_engine: "pyttsx3"
  language: "pt-BR"
  stt_model_path: "models/vosk"
  stt_sample_rate: 16000
  wake_word: "jarvis"
  enable_tts: true
  enable_stt: false

memory:
  db_path: "jarvis_memory.db"
  vector_enabled: false
  vector_path: "database/vectors"
  vector_collection: "jarvis_memory"
  embedding_model: "all-MiniLM-L6-v2"

plugins:
  directory: "plugins"
  autoload: true
  enabled: []          # vazio = carrega todos os plugins válidos encontrados
  disabled: []         # nomes de plugins para ignorar

